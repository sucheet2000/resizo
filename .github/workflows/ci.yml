name: CI

# One run per change. A pull request is proved by lint, tests, build and the
# E2E suite before it can merge, so the merge commit is not proved a second
# time: the push trigger is gone, and a push to a pull request cancels the run
# the previous push started. Eight runs of about four minutes on 2026-09-09
# would have been four.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # Non-blocking: surfaces new advisories on every PR without gating the
      # build. --omit=dev is a much narrower question than it used to be — the
      # image codecs, the rate limiter and the object-store client are all gone,
      # so what is left in the production tree is Next, React and the browser
      # codecs the tab downloads.
      - name: Dependency audit (non-blocking)
        run: npm audit --omit=dev || true

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Confirm build success
        run: echo "Build passed successfully"

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # No environment at all. There is no rate limiter to configure and no
      # image route to configure it for — every tool runs in the browser, and
      # playwright.config.js starts the server itself.
      - name: Run E2E suite
        run: npm run e2e
