name: CI

# One run per change. A pull request is proved by lint, tests, build and the
# E2E suite before it can merge, so the merge commit is not proved a second
# time: the push trigger is gone, and a push to a pull request cancels the run
# the previous push started. Eight runs of about four minutes on 2026-09-09
# would have been four.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # Non-blocking: surfaces new advisories on every PR without gating the
      # build. --omit=dev is a much narrower question than it used to be — the
      # image codecs, the rate limiter and the object-store client are all gone,
      # so what is left in the production tree is Next, React and the browser
      # codecs the tab downloads.
      - name: Dependency audit (non-blocking)
        run: npm audit --omit=dev || true

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Confirm build success
        run: echo "Build passed successfully"

  e2e:
    name: E2E (Chromium, full)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The authoritative run: every contract, every flow and the compatibility
      # set, in the reference browser. No environment at all — the tools run in
      # the browser, and playwright.config.js starts the server itself.
      - name: Run the full E2E suite in Chromium
        run: npm run e2e:chromium

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-browsers:
    name: E2E (Firefox, WebKit, mobile)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # The compatibility set only (tests/e2e/browser/**): representative real
      # processing paths in the browsers visitors actually hold, each verifying
      # the downloaded bytes. Playwright's WebKit is not Safari on a physical
      # iPhone; see tests/e2e/browser/README.md for what stays manual.
      - name: Run the compatibility projects
        run: npm run e2e:browsers

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-browsers
          path: |
            playwright-report/
            test-results/
          retention-days: 7
